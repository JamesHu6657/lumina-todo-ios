name: Scan Release Assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          out=$PWD/scan.txt; : > $out
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName'); do
            d=/tmp/r/$t; mkdir -p $d
            gh release download "$t" -R "$GITHUB_REPOSITORY" -D $d >/dev/null 2>&1 || true
            gh release download "$t" -R "$GITHUB_REPOSITORY" -A zip -D $d >/dev/null 2>&1 || true
            for f in $d/*; do
              x=$d/x_$(basename $f); mkdir -p $x; unzip -q -o "$f" -d $x 2>/dev/null || true
            done
            grep -rlaE "pk_[0-9]+_[A-Za-z0-9]{20,}" $d | sed "s#/tmp/r/##" | while read f; do
              m=$(grep -aoE "pk_[0-9]+_[A-Za-z0-9]{20,}" "/tmp/r/$f" | head -1)
              echo "$f  ${m:0:10}…${m: -4}" >> $out
            done
          done
          echo "done" >> $out
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan scan-result && git rm -rf --cached . >/dev/null
          git add -f scan.txt && git commit -qm scan && git push -f origin scan-result
