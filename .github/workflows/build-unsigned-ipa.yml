# Build an unsigned IPA for Sideloadly (Windows free Apple ID).
# No certificates, p12, provisioning profiles, or GitHub Secrets required.
name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest-stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Capacitor Podfile paths point into node_modules/@capacitor/*
      - name: Install npm dependencies
        run: npm ci

      # ios/App/App/public, capacitor.config.json, config.xml, cordova plugins are gitignored;
      # regenerate them from committed www/ before CocoaPods + archive.
      - name: Capacitor sync iOS
        run: |
          set -euo pipefail
          node scripts/assert-web-safe.js
          npx cap sync ios
          node scripts/post-cap-sync.js
          node scripts/assert-web-safe.js ios/App/App/public
          node scripts/verify-ios-public.js
          test -d ios/App/App/public
          test -f ios/App/App/capacitor.config.json

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          pod --version
          pod install --repo-update

      - name: Archive (signing fully disabled)
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO

      - name: Verify unsigned .app (no embedded.mobileprovision)
        run: |
          set -euo pipefail
          APP_PATH=$(echo "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app)
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH"
          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "::error::embedded.mobileprovision is present — build was signed, expected unsigned"
            exit 1
          fi
          echo "OK: embedded.mobileprovision is absent (unsigned)."
          # Codesign identity should be empty / ad-hoc when unsigned
          codesign -dv "$APP_PATH" 2>&1 || true

      - name: Package IPA (manual Payload zip; no exportArchive)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          # One level only: Payload/App.app (do not nest Payload/Payload/...)
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          echo "Payload tree:"
          find "$RUNNER_TEMP/Payload" -maxdepth 2 -print
          APP_COUNT=$(find "$RUNNER_TEMP/Payload" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')
          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one .app under Payload/, found $APP_COUNT"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          zip -qry App-unsigned.ipa Payload
          ls -lh "$RUNNER_TEMP/App-unsigned.ipa"
          # Sanity: zip root must be Payload/
          unzip -l "$RUNNER_TEMP/App-unsigned.ipa" | head -n 20

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: ${{ runner.temp }}/App-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
